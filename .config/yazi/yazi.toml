[mgr]
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"

[[opener.md-router]]
run = "~/.local/bin/md_router.sh %s1"
block = true
for = "unix"
desc = "Edit Markdown with oom-edit or Helix"

[[open.prepend_rules]]
url = "*.md"
use = "md-router"

# for: https://github.com/yazi-rs/plugins/tree/main/git.yazi
[[plugin.prepend_fetchers]]
group = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
group = "git"
url = "*/"
run = "git"
