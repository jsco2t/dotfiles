onboarding = false
[theme]
name = "nord"
auto_switch = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+space"
remove_worktree = "prefix+ctrl+g"
next_agent = "prefix+down"
previous_agent = "prefix+up"

[worktrees]
directory = "~/Developer/sources/trees"

[ui]
show_agent_labels_on_pane_borders = false
